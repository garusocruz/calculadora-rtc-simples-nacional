# Pull request para main. Roda a equivalência e não publica.
# O push na main usa cloudbuild-prod.yaml.
timeout: 3600s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM

steps:
  - id: equivalencia
    name: eclipse-temurin:25-jdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq python3 python3-pip python3-venv git ca-certificates curl
        python3 -m venv /opt/venv
        /opt/venv/bin/pip install pytest pytest-cov
        export PATH="/opt/venv/bin:$$PATH"
        bash scripts/equivalencia.sh
