# Equivalência com a calculadora oficial da Receita.
# A única versão é a de produção: a tag vX.Y.Z dispara este arquivo,
# roda a equivalência e publica só esse pacote no PyPI.
# Não há trigger de pull request nem de push na main.
# Não publica no Artifact Registry e não aplica Terraform.
timeout: 3600s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/PYPI_API_TOKEN/versions/latest
      env: PYPI_API_TOKEN

steps:
  - id: equivalencia
    name: eclipse-temurin:25-jdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq python3 python3-pip python3-venv git ca-certificates
        python3 -m venv /opt/venv
        /opt/venv/bin/pip install pytest pytest-cov
        export PATH="/opt/venv/bin:$$PATH"
        bash scripts/equivalencia.sh

  - id: publicar
    name: eclipse-temurin:25-jdk
    waitFor: ["equivalencia"]
    secretEnv: ["PYPI_API_TOKEN"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        tag="$${TAG_NAME:-}"
        if [[ ! "$${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Sem tag de produção vX.Y.Z. Não publica."
          exit 0
        fi
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq python3 python3-pip python3-venv
        python3 -m venv /opt/publish
        /opt/publish/bin/pip install poetry
        versao="$${tag#v}"
        no_pyproject="$$(/opt/publish/bin/poetry version -s)"
        if [[ "$${versao}" != "$${no_pyproject}" ]]; then
          echo "A tag $${tag} não é a versão $${no_pyproject} do pyproject."
          exit 1
        fi
        /opt/publish/bin/poetry config pypi-token.pypi "$$PYPI_API_TOKEN"
        /opt/publish/bin/poetry publish --build --no-interaction
