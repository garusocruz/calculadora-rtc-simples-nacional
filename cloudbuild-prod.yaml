# Push na main. Equivalência, quality gates e publicação da versão do pyproject no PyPI.
# É a única versão publicada: a de produção. Não publica no Artifact Registry.
substitutions:
  _LIB_NAME: calculadora_rtc_simples_nacional
  _ENVIRONMENT: production
  _REGION: us-central1
  _RUN_TERRAFORM: "0"
  _RUN_PUBLISH: "1"
  _GITHUB_OWNER: garusocruz
  _GITHUB_REPO: calculadora-rtc-simples-nacional
  _CONTEXT: calculadora-rtc-simples-nacional

timeout: 3600s

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/PYPI_API_TOKEN/versions/latest
      env: PYPI_API_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM

steps:
  - id: equivalencia
    name: eclipse-temurin:25-jdk
    waitFor: ["-"]
    allowFailure: true
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq python3 python3-pip python3-venv git ca-certificates curl
        python3 -m venv /opt/venv
        /opt/venv/bin/pip install pytest pytest-cov
        export PATH="/opt/venv/bin:$$PATH"
        mkdir -p /workspace/.ci/steps
        set +e
        bash scripts/equivalencia.sh
        code=$$?
        set -e
        echo "$${code}" | tee /workspace/.ci/exit_code > /workspace/.ci/steps/equivalencia.exit
        exit "$${code}"

  - id: quality-gates
    name: eclipse-temurin:25-jdk
    waitFor: ["equivalencia"]
    allowFailure: true
    entrypoint: bash
    env:
      - COVERAGE_FAIL_UNDER=80
      - PYTEST_VENV=/workspace/.ci/pytest-venv
    args:
      - -c
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq python3 python3-pip python3-venv git ca-certificates curl
        mkdir -p /workspace/.ci/steps /workspace/.ci/trivy-cache
        chmod +x scripts/ci-quality-gates.sh scripts/run-trivy-fs.sh scripts/hooks/*.sh
        export TRIVY_CACHE_DIR=/workspace/.ci/trivy-cache
        set +e
        bash scripts/ci-quality-gates.sh cb
        code=$$?
        set -e
        echo "$${code}" | tee /workspace/.ci/exit_code > /workspace/.ci/steps/quality-gates.exit
        exit "$${code}"

  - id: publicar
    name: python:3.12-slim
    waitFor: ["quality-gates"]
    allowFailure: true
    secretEnv: ["PYPI_API_TOKEN"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        mkdir -p /workspace/.ci/steps
        trap 'code=$$?; echo "$${code}" | tee /workspace/.ci/exit_code > /workspace/.ci/steps/publicar.exit' EXIT
        if [ "${_RUN_PUBLISH}" != "1" ]; then
          echo "skip publish (_RUN_PUBLISH=${_RUN_PUBLISH})"
          exit 0
        fi
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq curl ca-certificates
        pip install -q poetry
        nome="$$(awk -F'"' '/^name = /{print $$2; exit}' pyproject.toml)"
        versao="$$(poetry version -s)"
        python3 - CHANGELOG.md "$${versao}" <<'PY'
        import pathlib, sys
        path, ver = sys.argv[1], sys.argv[2]
        text = pathlib.Path(path).read_text(encoding="utf-8") if pathlib.Path(path).exists() else ""
        heading = f"## {ver}"
        start = text.find(heading)
        if start < 0:
            raise SystemExit(f"CHANGELOG.md não tem a seção {heading}")
        rest = text[start + len(heading):]
        nxt = rest.find("\n## ")
        body = rest if nxt < 0 else rest[:nxt]
        print(f"── mudanças da {ver} ──")
        print(body.strip())
        PY
        codigo="$$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$${nome}/$${versao}/json")"
        if [[ "$${codigo}" == "200" ]]; then
          echo "A versão $${versao} já está no PyPI. O merge não gera outra."
          exit 0
        fi
        if [[ "$${codigo}" != "404" ]]; then
          echo "O PyPI respondeu $${codigo}. Não publica."
          exit 1
        fi
        poetry config pypi-token.pypi "$$PYPI_API_TOKEN"
        poetry publish --build --no-interaction

  - id: report-pr
    allowFailure: true
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ["publicar"]
    entrypoint: bash
    env:
      - PROJECT_ID=$PROJECT_ID
      - BUILD_ID=$BUILD_ID
      - COMMIT_SHA=$COMMIT_SHA
      - SHORT_SHA=$SHORT_SHA
      - _ENVIRONMENT=$_ENVIRONMENT
      - _REGION=$_REGION
      - _GITHUB_OWNER=$_GITHUB_OWNER
      - _GITHUB_REPO=$_GITHUB_REPO
      - _CONTEXT=$_CONTEXT
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq python3 >/dev/null
        chmod +x deploy/scripts/report-pr-status.sh
        bash deploy/scripts/report-pr-status.sh

  - id: pipeline-gate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ["report-pr"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        chmod +x deploy/scripts/pipeline-gate.sh
        exec bash deploy/scripts/pipeline-gate.sh
